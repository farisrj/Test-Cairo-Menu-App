<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- Egyptian-inspired corner decoration: Top-Left -->
  <!-- Geometric lotus and papyrus motif with pharaonic border elements -->
  
  <!-- Outer geometric frame -->
  <path d="M0 0 L380 0 L360 20 L20 20 L20 360 L0 380 Z" 
        fill="url(#goldGrad1)" opacity="0.6"/>
  
  <!-- Inner geometric frame -->
  <path d="M0 0 L340 0 L320 15 L15 15 L15 320 L0 340 Z" 
        fill="none" stroke="url(#goldGrad1)" stroke-width="1.5" opacity="0.4"/>
  
  <!-- Lotus flower cluster - top corner -->
  <g transform="translate(30, 30)" opacity="0.7">
    <!-- Central lotus -->
    <path d="M60 120 Q60 60 30 20 Q60 40 60 0 Q60 40 90 20 Q60 60 60 120Z" 
          fill="url(#goldGrad2)" opacity="0.5"/>
    <!-- Left petal -->
    <path d="M60 100 Q30 70 10 40 Q40 60 60 100Z" 
          fill="url(#goldGrad2)" opacity="0.35"/>
    <!-- Right petal -->
    <path d="M60 100 Q90 70 110 40 Q80 60 60 100Z" 
          fill="url(#goldGrad2)" opacity="0.35"/>
    <!-- Stem -->
    <line x1="60" y1="120" x2="60" y2="160" stroke="url(#goldGrad1)" stroke-width="2" opacity="0.3"/>
  </g>
  
  <!-- Papyrus fan pattern -->
  <g transform="translate(140, 40)" opacity="0.45">
    <path d="M0 80 Q10 40 30 0 Q20 40 40 80Z" fill="url(#goldGrad2)"/>
    <path d="M20 80 Q25 30 50 0 Q35 35 50 80Z" fill="url(#goldGrad2)" opacity="0.7"/>
    <path d="M-10 80 Q0 35 10 0 Q5 40 -5 80Z" fill="url(#goldGrad2)" opacity="0.7"/>
  </g>
  
  <!-- Geometric repeating border - horizontal -->
  <g opacity="0.5">
    <rect x="40" y="35" width="8" height="8" fill="url(#goldGrad1)" transform="rotate(45 44 39)"/>
    <rect x="65" y="35" width="8" height="8" fill="url(#goldGrad1)" transform="rotate(45 69 39)"/>
    <rect x="90" y="35" width="8" height="8" fill="url(#goldGrad1)" transform="rotate(45 94 39)"/>
    <rect x="115" y="35" width="8" height="8" fill="url(#goldGrad1)" transform="rotate(45 119 39)"/>
    <rect x="140" y="35" width="8" height="8" fill="url(#goldGrad1)" transform="rotate(45 144 39)"/>
    <rect x="165" y="35" width="8" height="8" fill="url(#goldGrad1)" transform="rotate(45 169 39)"/>
    <rect x="190" y="35" width="8" height="8" fill="url(#goldGrad1)" transform="rotate(45 194 39)"/>
    <rect x="215" y="35" width="8" height="8" fill="url(#goldGrad1)" transform="rotate(45 219 39)"/>
    <rect x="240" y="35" width="8" height="8" fill="url(#goldGrad1)" transform="rotate(45 244 39)"/>
    <rect x="265" y="35" width="8" height="8" fill="url(#goldGrad1)" transform="rotate(45 269 39)"/>
    <rect x="290" y="35" width="8" height="8" fill="url(#goldGrad1)" transform="rotate(45 294 39)"/>
  </g>
  
  <!-- Geometric repeating border - vertical -->
  <g opacity="0.5">
    <rect x="35" y="65" width="8" height="8" fill="url(#goldGrad1)" transform="rotate(45 39 69)"/>
    <rect x="35" y="90" width="8" height="8" fill="url(#goldGrad1)" transform="rotate(45 39 94)"/>
    <rect x="35" y="115" width="8" height="8" fill="url(#goldGrad1)" transform="rotate(45 39 119)"/>
    <rect x="35" y="140" width="8" height="8" fill="url(#goldGrad1)" transform="rotate(45 39 144)"/>
    <rect x="35" y="165" width="8" height="8" fill="url(#goldGrad1)" transform="rotate(45 39 169)"/>
    <rect x="35" y="190" width="8" height="8" fill="url(#goldGrad1)" transform="rotate(45 39 194)"/>
    <rect x="35" y="215" width="8" height="8" fill="url(#goldGrad1)" transform="rotate(45 39 219)"/>
    <rect x="35" y="240" width="8" height="8" fill="url(#goldGrad1)" transform="rotate(45 39 244)"/>
    <rect x="35" y="265" width="8" height="8" fill="url(#goldGrad1)" transform="rotate(45 39 269)"/>
    <rect x="35" y="290" width="8" height="8" fill="url(#goldGrad1)" transform="rotate(45 39 294)"/>
  </g>
  
  <!-- Eye of Horus simplified motif -->
  <g transform="translate(60, 200)" opacity="0.35">
    <ellipse cx="30" cy="15" rx="25" ry="12" fill="none" stroke="url(#goldGrad1)" stroke-width="2"/>
    <circle cx="30" cy="15" r="6" fill="url(#goldGrad2)" opacity="0.6"/>
    <path d="M55 15 Q65 25 55 40 L50 30 Q55 20 55 15Z" fill="url(#goldGrad1)" opacity="0.4"/>
    <path d="M5 15 Q-5 25 5 40 L10 30 Q5 20 5 15Z" fill="url(#goldGrad1)" opacity="0.4"/>
  </g>
  
  <!-- Scarab wing pattern -->
  <g transform="translate(170, 100)" opacity="0.3">
    <path d="M40 0 Q80 20 100 60 Q70 40 40 40 Q10 40 -20 60 Q0 20 40 0Z" 
          fill="none" stroke="url(#goldGrad1)" stroke-width="1.5"/>
    <circle cx="40" cy="20" r="8" fill="url(#goldGrad2)" opacity="0.4"/>
  </g>
  
  <!-- Ankh symbol -->
  <g transform="translate(250, 180)" opacity="0.25">
    <ellipse cx="20" cy="15" rx="12" ry="15" fill="none" stroke="url(#goldGrad1)" stroke-width="2"/>
    <line x1="20" y1="30" x2="20" y2="70" stroke="url(#goldGrad1)" stroke-width="2"/>
    <line x1="8" y1="45" x2="32" y2="45" stroke="url(#goldGrad1)" stroke-width="2"/>
  </g>
  
  <!-- Pyramid silhouette -->
  <g transform="translate(100, 280)" opacity="0.2">
    <path d="M0 60 L40 0 L80 60Z" fill="none" stroke="url(#goldGrad1)" stroke-width="1.5"/>
    <path d="M30 60 L60 10 L90 60Z" fill="none" stroke="url(#goldGrad1)" stroke-width="1" opacity="0.6"/>
  </g>
  
  <!-- Decorative dots pattern -->
  <g opacity="0.3">
    <circle cx="320" cy="10" r="2" fill="url(#goldGrad2)"/>
    <circle cx="340" cy="10" r="2" fill="url(#goldGrad2)"/>
    <circle cx="360" cy="10" r="2" fill="url(#goldGrad2)"/>
    <circle cx="10" cy="320" r="2" fill="url(#goldGrad2)"/>
    <circle cx="10" cy="340" r="2" fill="url(#goldGrad2)"/>
    <circle cx="10" cy="360" r="2" fill="url(#goldGrad2)"/>
  </g>
  
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="goldGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9a84c" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#d4af37" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#b8860b" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0d68a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c9a84c" stop-opacity="0.5"/>
    </linearGradient>
  </defs>
</svg>