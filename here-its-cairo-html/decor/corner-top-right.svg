<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- Egyptian-inspired corner decoration: Top-Right (mirrored) -->
  
  <!-- Outer geometric frame -->
  <path d="M400 0 L20 0 L40 20 L380 20 L380 360 L400 380 Z" 
        fill="url(#goldGradTR1)" opacity="0.6"/>
  
  <!-- Inner geometric frame -->
  <path d="M400 0 L60 0 L80 15 L385 15 L385 320 L400 340 Z" 
        fill="none" stroke="url(#goldGradTR1)" stroke-width="1.5" opacity="0.4"/>
  
  <!-- Lotus flower cluster - top corner -->
  <g transform="translate(310, 30)" opacity="0.7">
    <!-- Central lotus -->
    <path d="M60 120 Q60 60 30 20 Q60 40 60 0 Q60 40 90 20 Q60 60 60 120Z" 
          fill="url(#goldGradTR2)" opacity="0.5"/>
    <!-- Left petal -->
    <path d="M60 100 Q30 70 10 40 Q40 60 60 100Z" 
          fill="url(#goldGradTR2)" opacity="0.35"/>
    <!-- Right petal -->
    <path d="M60 100 Q90 70 110 40 Q80 60 60 100Z" 
          fill="url(#goldGradTR2)" opacity="0.35"/>
    <!-- Stem -->
    <line x1="60" y1="120" x2="60" y2="160" stroke="url(#goldGradTR1)" stroke-width="2" opacity="0.3"/>
  </g>
  
  <!-- Papyrus fan pattern -->
  <g transform="translate(220, 40)" opacity="0.45">
    <path d="M0 80 Q10 40 30 0 Q20 40 40 80Z" fill="url(#goldGradTR2)"/>
    <path d="M20 80 Q25 30 50 0 Q35 35 50 80Z" fill="url(#goldGradTR2)" opacity="0.7"/>
    <path d="M-10 80 Q0 35 10 0 Q5 40 -5 80Z" fill="url(#goldGradTR2)" opacity="0.7"/>
  </g>
  
  <!-- Geometric repeating border - horizontal -->
  <g opacity="0.5">
    <rect x="100" y="35" width="8" height="8" fill="url(#goldGradTR1)" transform="rotate(45 104 39)"/>
    <rect x="125" y="35" width="8" height="8" fill="url(#goldGradTR1)" transform="rotate(45 129 39)"/>
    <rect x="150" y="35" width="8" height="8" fill="url(#goldGradTR1)" transform="rotate(45 154 39)"/>
    <rect x="175" y="35" width="8" height="8" fill="url(#goldGradTR1)" transform="rotate(45 179 39)"/>
    <rect x="200" y="35" width="8" height="8" fill="url(#goldGradTR1)" transform="rotate(45 204 39)"/>
    <rect x="225" y="35" width="8" height="8" fill="url(#goldGradTR1)" transform="rotate(45 229 39)"/>
    <rect x="250" y="35" width="8" height="8" fill="url(#goldGradTR1)" transform="rotate(45 254 39)"/>
    <rect x="275" y="35" width="8" height="8" fill="url(#goldGradTR1)" transform="rotate(45 279 39)"/>
    <rect x="300" y="35" width="8" height="8" fill="url(#goldGradTR1)" transform="rotate(45 304 39)"/>
    <rect x="325" y="35" width="8" height="8" fill="url(#goldGradTR1)" transform="rotate(45 329 39)"/>
    <rect x="350" y="35" width="8" height="8" fill="url(#goldGradTR1)" transform="rotate(45 354 39)"/>
  </g>
  
  <!-- Geometric repeating border - vertical -->
  <g opacity="0.5">
    <rect x="357" y="65" width="8" height="8" fill="url(#goldGradTR1)" transform="rotate(45 361 69)"/>
    <rect x="357" y="90" width="8" height="8" fill="url(#goldGradTR1)" transform="rotate(45 361 94)"/>
    <rect x="357" y="115" width="8" height="8" fill="url(#goldGradTR1)" transform="rotate(45 361 119)"/>
    <rect x="357" y="140" width="8" height="8" fill="url(#goldGradTR1)" transform="rotate(45 361 144)"/>
    <rect x="357" y="165" width="8" height="8" fill="url(#goldGradTR1)" transform="rotate(45 361 169)"/>
    <rect x="357" y="190" width="8" height="8" fill="url(#goldGradTR1)" transform="rotate(45 361 194)"/>
    <rect x="357" y="215" width="8" height="8" fill="url(#goldGradTR1)" transform="rotate(45 361 219)"/>
    <rect x="357" y="240" width="8" height="8" fill="url(#goldGradTR1)" transform="rotate(45 361 244)"/>
    <rect x="357" y="265" width="8" height="8" fill="url(#goldGradTR1)" transform="rotate(45 361 269)"/>
    <rect x="357" y="290" width="8" height="8" fill="url(#goldGradTR1)" transform="rotate(45 361 294)"/>
  </g>
  
  <!-- Winged sun disk -->
  <g transform="translate(200, 100)" opacity="0.3">
    <circle cx="60" cy="20" r="10" fill="url(#goldGradTR2)" opacity="0.5"/>
    <path d="M60 20 Q30 5 0 15 Q20 10 40 20 Q20 30 0 25 Q30 35 60 20Z" 
          fill="url(#goldGradTR1)" opacity="0.4"/>
    <path d="M60 20 Q90 5 120 15 Q100 10 80 20 Q100 30 120 25 Q90 35 60 20Z" 
          fill="url(#goldGradTR1)" opacity="0.4"/>
  </g>
  
  <!-- Ankh symbol -->
  <g transform="translate(120, 180)" opacity="0.25">
    <ellipse cx="20" cy="15" rx="12" ry="15" fill="none" stroke="url(#goldGradTR1)" stroke-width="2"/>
    <line x1="20" y1="30" x2="20" y2="70" stroke="url(#goldGradTR1)" stroke-width="2"/>
    <line x1="8" y1="45" x2="32" y2="45" stroke="url(#goldGradTR1)" stroke-width="2"/>
  </g>
  
  <!-- Scarab beetle simplified -->
  <g transform="translate(300, 220)" opacity="0.25">
    <ellipse cx="25" cy="20" rx="18" ry="14" fill="none" stroke="url(#goldGradTR1)" stroke-width="1.5"/>
    <circle cx="25" cy="20" r="6" fill="url(#goldGradTR2)" opacity="0.4"/>
    <path d="M7 20 Q-5 10 -10 0" fill="none" stroke="url(#goldGradTR1)" stroke-width="1.2" opacity="0.5"/>
    <path d="M43 20 Q55 10 60 0" fill="none" stroke="url(#goldGradTR1)" stroke-width="1.2" opacity="0.5"/>
  </g>
  
  <!-- Pyramid silhouette -->
  <g transform="translate(220, 280)" opacity="0.2">
    <path d="M0 60 L40 0 L80 60Z" fill="none" stroke="url(#goldGradTR1)" stroke-width="1.5"/>
    <path d="M30 60 L60 10 L90 60Z" fill="none" stroke="url(#goldGradTR1)" stroke-width="1" opacity="0.6"/>
  </g>
  
  <!-- Decorative dots -->
  <g opacity="0.3">
    <circle cx="40" cy="10" r="2" fill="url(#goldGradTR2)"/>
    <circle cx="60" cy="10" r="2" fill="url(#goldGradTR2)"/>
    <circle cx="80" cy="10" r="2" fill="url(#goldGradTR2)"/>
    <circle cx="390" cy="320" r="2" fill="url(#goldGradTR2)"/>
    <circle cx="390" cy="340" r="2" fill="url(#goldGradTR2)"/>
    <circle cx="390" cy="360" r="2" fill="url(#goldGradTR2)"/>
  </g>
  
  <defs>
    <linearGradient id="goldGradTR1" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c9a84c" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#d4af37" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#b8860b" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="goldGradTR2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0d68a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c9a84c" stop-opacity="0.5"/>
    </linearGradient>
  </defs>
</svg>