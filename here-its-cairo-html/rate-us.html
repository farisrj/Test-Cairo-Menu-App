<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Here-Its-Cairo Café | Rate Us</title>
    <link rel="stylesheet" href="css/styles.css">
    <meta name="description" content="Share your experience and rate Here-Its-Cairo Café.">
    <meta name="theme-color" content="#0a0e17">
</head>
<body>

    <!-- Sticky Header -->
    <header class="site-header">
        <a href="index.html" class="logo-container">
            <div class="logo-icon">H</div>
            <span class="logo-text">Here-Its-Cairo</span>
        </a>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <div class="content-section">
            <div class="breadcrumbs">
                <a href="index.html">Home</a> <span>›</span> Rate Us
            </div>

            <h1 class="section-title">Rate Your Experience</h1>
            <p class="text-center mb-2" style="color: var(--text-secondary);">We value your feedback. Please let us know how we did!</p>

            <div class="form-container">
                <form action="#" method="POST" onsubmit="event.preventDefault(); alert('Thank you for your feedback!');">
                    
                    <div class="form-group">
                        <label>Overall Rating</label>
                        <div class="rating-stars">
                            <input type="radio" id="star5" name="rating" value="5" required>
                            <label for="star5" title="5 stars">★</label>
                            <input type="radio" id="star4" name="rating" value="4">
                            <label for="star4" title="4 stars">★</label>
                            <input type="radio" id="star3" name="rating" value="3">
                            <label for="star3" title="3 stars">★</label>
                            <input type="radio" id="star2" name="rating" value="2">
                            <label for="star2" title="2 stars">★</label>
                            <input type="radio" id="star1" name="rating" value="1">
                            <label for="star1" title="1 star">★</label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="name">Your Name (Optional)</label>
                        <input type="text" id="name" name="name" class="form-control" placeholder="Enter your name">
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address (Optional)</label>
                        <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email">
                    </div>

                    <div class="form-group">
                        <label for="comments">Comments</label>
                        <textarea id="comments" name="comments" class="form-control" rows="5" placeholder="Tell us about your experience..." required></textarea>
                    </div>

                    <button type="submit" class="btn" style="width: 100%;">Submit Rating</button>
                </form>
            </div>
        </div>
    </main>

    <!-- Mobile Bottom Navigation -->
    <nav class="mobile-bottom-nav">
        <a href="index.html" class="mobile-nav-item">
            <span class="mobile-nav-icon">🏠</span>
            <span class="mobile-nav-label">Home</span>
        </a>
        <a href="categories.html" class="mobile-nav-item">
            <span class="mobile-nav-icon">☕</span>
            <span class="mobile-nav-label">Menu</span>
        </a>
        <a href="gallery.html" class="mobile-nav-item">
            <span class="mobile-nav-icon">📸</span>
            <span class="mobile-nav-label">Gallery</span>
        </a>
        <a href="rate-us.html" class="mobile-nav-item active">
            <span class="mobile-nav-icon">⭐</span>
            <span class="mobile-nav-label">Rate</span>
        </a>
        <a href="contact-us.html" class="mobile-nav-item">
            <span class="mobile-nav-icon">📍</span>
            <span class="mobile-nav-label">Contact</span>
        </a>
    </nav>

    <!-- Desktop Footer -->
    <footer class="site-footer">
        <p class="footer-copy">&copy; 2026 Here-Its-Cairo Café. All rights reserved.</p>
    </footer>

</body>
</html>
